<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Chaveamento</title>

    <link rel="stylesheet" href="Style/style.css">
</head>
<body>

    <div id="container">

        <h1>Gerador de Chaveamento</h1>

        <p>Digite as equipes separadas por vírgula.</p>

        <textarea
            id="equipes"
            placeholder="Exemplo: Brasil, Argentina, França, Alemanha">
        </textarea>

        <br>

        <button id="btnGerar">
            Gerar Chaveamento
        </button>

        <hr>

        <div id="faseAtual">

        </div>

        <div id="jogos">

        </div>

        <button id="btnConfirmar" disabled>
            Confirmar Resultados
        </button>

        <div id="campeao">

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
